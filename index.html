<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="AI 产品经理知识体系：以四类产品判断串起 Agent、Harness、MCP 与 Personal AI 理论的学习地图。" />
<title>AI 产品经理知识体系</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#6366f1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AI PM 体系"/>
<meta name="mobile-web-app-capable" content="yes"/>
<style>
  :root{
    --bg:#f4f5fb; --surface:#ffffff; --surface-2:#f8f9ff; --text:#16182b; --muted:#6b7089;
    --border:#e7e9f4; --shadow:0 4px 18px rgba(30,34,80,.06); --shadow-lg:0 14px 44px rgba(30,34,80,.14);
    --hard:#6366f1; --soft:#ec4899; --practice:#10b981;
    --accent:#6366f1; --warn:#f59e0b; --ok:#10b981;
    --ring-track:#eceefb; --chip:#eef0fb; --field:#f4f5fb;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --nav-h:60px; --r:14px;
  }
  [data-theme="dark"]{
    --bg:#0d0e1a; --surface:#171827; --surface-2:#1e2033; --text:#eef0fb; --muted:#9aa0c0;
    --border:#262a44; --shadow:0 4px 18px rgba(0,0,0,.36); --shadow-lg:0 14px 44px rgba(0,0,0,.55);
    --ring-track:#24273d; --chip:#23263b; --field:#12131f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; overflow-x:hidden;
    -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
    min-height:100vh; min-height:100dvh;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea{font-family:inherit}
  .hidden{display:none !important}

  /* ============ 布局骨架 ============ */
  .shell{display:block}
  .main{padding:0 16px calc(var(--nav-h) + var(--safe-b) + 28px);max-width:820px;margin:0 auto}
  .rail{display:none}
  .bottomnav{display:flex}

  @media(min-width:1024px){
    .shell{display:grid;grid-template-columns:252px minmax(0,1fr);gap:32px;
      max-width:1186px;margin:0 auto;padding:0 28px;align-items:start}
    .rail{display:flex;position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column;gap:18px;
      padding:26px 0 22px}
    .main{max-width:860px;margin:0;padding:26px 0 64px}
    .bottomnav{display:none}
    .appbar{display:none !important}
  }

  /* ============ 顶栏（手机 / 平板） ============ */
  .appbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    margin:0 -16px;padding:calc(var(--safe-t) + 10px) 16px 10px;
    background:var(--bg);
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid transparent;transition:border-color .2s;
  }
  .appbar.stuck{border-bottom-color:var(--border)}
  .ab-title{font-size:18px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
  .ab-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

  .icon-btn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:16px;display:grid;place-items:center;transition:.18s;flex:0 0 auto;
  }
  .icon-btn:active{transform:scale(.94)}
  @media(hover:hover){.icon-btn:hover{border-color:var(--accent);color:var(--accent)}}

  .timer-pill{
    display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:0;
    background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;font-weight:700;font-size:14px;
    font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(99,102,241,.34);
  }
  .timer-pill .tp-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ============ 侧边栏（iPad 横屏 / 桌面） ============ */
  .brand{display:flex;gap:11px;align-items:center;padding:0 6px}
  .brand .b-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;flex:0 0 auto}
  .brand h1{font-size:15.5px;font-weight:800;line-height:1.25}
  .brand p{font-size:11.5px;color:var(--muted);margin-top:1px}
  .rail-nav{display:flex;flex-direction:column;gap:4px}
  .rail-nav button{
    display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:12px;
    background:transparent;color:var(--muted);font-size:14px;font-weight:650;text-align:left;transition:.16s;
  }
  .rail-nav button .rn-ic{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
  .rail-nav button .rn-badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;
    background:var(--chip);color:var(--muted)}
  .rail-nav button.on{background:var(--accent);color:#fff}
  .rail-nav button.on .rn-badge{background:rgba(255,255,255,.24);color:#fff}
  @media(hover:hover){.rail-nav button:not(.on):hover{background:var(--surface);color:var(--text)}}
  .rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .rail-bottom .timer-pill{width:100%;justify-content:center}
  .rail-link{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;
    border-radius:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:650;
    text-align:left;transition:.16s}
  .rail-link .rn-ic{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
  @media(hover:hover){.rail-link:hover{background:var(--surface);color:var(--text)}}
  .rail-foot{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:15px;box-shadow:var(--shadow)}
  .rail-foot .rf-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .ring{position:relative}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}

  /* ============ 底部导航（手机 / iPad 竖屏） ============ */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:stretch;
    padding:6px 6px calc(var(--safe-b) + 6px);
    background:var(--surface);
    background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--border);
  }
  .bottomnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:650;
    padding:8px 2px;border-radius:13px;min-height:50px;position:relative;transition:.16s;
  }
  .bottomnav button .bn-ic{font-size:20px;line-height:1;transition:transform .18s}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav button.on .bn-ic{transform:translateY(-1px) scale(1.08)}
  .bottomnav button .bn-dot{position:absolute;top:6px;left:calc(50% + 4px);min-width:16px;height:16px;
    border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;
    display:grid;place-items:center;padding:0 4px}

  /* ============ 通用 ============ */
  .sect-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;margin:22px 2px 10px}
  .sect-h .sh-sub{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:auto;text-align:right}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;
    box-shadow:var(--shadow)}
  .panel + .panel{margin-top:12px}

  /* ============ 今日承诺 ============ */
  .promise{border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 52%,#ec4899 100%);box-shadow:var(--shadow-lg)}
  .promise.done{background:linear-gradient(135deg,#059669 0%,#10b981 60%,#34d399 100%)}
  .promise::after{content:"";position:absolute;inset:0;
    background:radial-gradient(600px 200px at 12% -20%,rgba(255,255,255,.3),transparent 62%)}
  .promise > *{position:relative;z-index:2}
  .p-top{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;opacity:.95;letter-spacing:.4px}
  .p-big{font-size:27px;font-weight:850;margin:9px 0 3px;line-height:1.2;letter-spacing:-.4px}
  .p-sub{font-size:13px;opacity:.93}
  .p-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.28);margin:14px 0 6px;overflow:hidden}
  .p-bar > i{display:block;height:100%;border-radius:6px;background:#fff;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .p-actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  .p-actions .btn{flex:1;min-width:120px}

  .btn{border:0;border-radius:13px;padding:13px 18px;font-size:14.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;min-height:46px}
  .btn:active{transform:scale(.975)}
  .btn-white{background:#fff;color:#4f46e5}
  .btn-ghost-w{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.38)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-soft{background:var(--chip);color:var(--accent)}
  .btn-line{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-block{width:100%}
  .btn-sm{padding:9px 14px;font-size:13px;min-height:40px;border-radius:11px}

  /* ============ 焦点卡 ============ */
  .focus{background:var(--surface);border:1px solid var(--border);border-radius:20px;
    box-shadow:var(--shadow);overflow:hidden}
  .focus-accent{height:4px}
  .focus-in{padding:17px}
  .f-crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:650;color:var(--muted);
    margin-bottom:9px;flex-wrap:wrap}
  .f-crumb .tag{padding:2px 9px;border-radius:20px;font-weight:700}
  .f-title{font-size:19.5px;font-weight:800;line-height:1.3;letter-spacing:-.2px;margin-bottom:5px}
  .f-desc{font-size:13px;color:var(--muted);margin-bottom:14px}
  .action-box{background:var(--surface-2);border:1px dashed var(--border);border-radius:15px;padding:14px}
  .ab-label{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.6px;margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  .ab-text{font-size:15px;font-weight:650;line-height:1.55}
  .kpi-row{display:flex;gap:8px;align-items:flex-start;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
  .kpi-row .k-ic{font-size:14px;flex:0 0 auto;margin-top:1px}
  .kpi-row .k-tx{font-size:12.5px;color:var(--muted);line-height:1.55}
  .kpi-row .k-tx b{color:var(--text);font-weight:700}
  .f-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .meta-pill{font-size:12px;font-weight:650;padding:5px 11px;border-radius:20px;background:var(--chip);
    color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .f-actions{display:flex;gap:9px;flex-wrap:wrap}
  .f-actions .btn{flex:1 1 0;min-width:0}
  .f-actions .btn-wide{flex:1 0 100%}
  /* E: 「现在有几分钟」时长选择 */
  .budget{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .budget .bg-lb{font-size:12.5px;color:var(--muted);font-weight:650}
  .budget button{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
    border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;min-height:38px;transition:.16s}
  .budget button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);
    line-height:1.55;margin-bottom:12px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
  .hint-line b{color:var(--text)}
  .hint-line.warn{background:rgba(245,158,11,.13);color:#b45309}
  [data-theme="dark"] .hint-line.warn{color:#fbbf24}
  /* 「为什么是它」——把推荐依据摊开给你看 */
  .why{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--muted);
    line-height:1.62;margin:0 0 12px}
  .why .wy-ic{flex:0 0 auto;font-size:13px;margin-top:1px}
  .why b{color:var(--text);font-weight:700}
  .why .wy-meta{display:block;color:var(--muted);opacity:.85;margin-top:3px}

  /* ============ 进度条 / 统计 ============ */
  .bar{height:9px;border-radius:6px;background:var(--ring-track);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .bar.sm{height:6px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:23px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--muted);font-weight:600}
  .stat .s-ic{font-size:14px;margin-bottom:5px;display:block}

  /* ============ 列表行 ============ */
  .row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;background:var(--surface-2);
    margin-bottom:8px;min-height:52px}
  .row:last-child{margin-bottom:0}
  .row .r-tx{flex:1;font-size:14px;font-weight:600;min-width:0;cursor:pointer}
  .row .r-sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .row.done .r-tx{opacity:.55}
  .row.done .r-t{text-decoration:line-through}
  .r-t{display:block}
  .row-x{border:0;background:transparent;color:var(--muted);font-size:15px;padding:8px 10px;border-radius:9px;
    opacity:.6;flex:0 0 auto;min-height:40px;min-width:40px}
  .row-x:active{background:var(--chip);opacity:1}

  .checkbox{width:26px;height:26px;border-radius:9px;border:2px solid var(--border);flex:0 0 auto;
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;transition:.18s;background:transparent}
  .checkbox.on{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent))}
  .checkbox.st1{background:var(--warn);border-color:var(--warn)}

  /* ============ 知识地图 ============ */
  .pillars{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:600px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:17px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left;width:100%;transition:.18s}
  .link-row a.btn{text-decoration:none}
  .pcard:active{transform:scale(.985)}
  @media(hover:hover){.pcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}}
  .pcard .glow{position:absolute;right:-34px;top:-34px;width:112px;height:112px;border-radius:50%;
    opacity:.13;filter:blur(7px)}
  .pcard .pc-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
    color:#fff;margin-bottom:11px;position:relative}
  .pcard h3{font-size:15.5px;font-weight:750;position:relative}
  .pcard .pc-sub{font-size:12px;color:var(--muted);margin-bottom:12px;position:relative}
  .pcard .pc-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
    margin-bottom:6px;position:relative}
  .pcard .pc-line b{color:var(--text);font-variant-numeric:tabular-nums}

  .filterbar{display:flex;gap:8px;align-items:center;margin:16px 0 14px;flex-wrap:wrap}
  .search{flex:1;min-width:170px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:13px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:.18s;min-height:46px}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
  .search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}
  .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:13px;
    padding:4px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;
    padding:9px 13px;border-radius:10px;transition:.16s;white-space:nowrap;min-height:38px;flex:0 0 auto}
  .seg button.on{background:var(--accent);color:#fff}

  .group{margin-bottom:22px}
  .group-h{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:750;margin-bottom:11px}
  .group-h .count{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--chip);
    padding:2px 9px;border-radius:20px;margin-left:auto}

  .cards{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:15px;
    padding:13px 13px 13px 15px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--shadow);
    transition:.18s;text-align:left;width:100%;cursor:pointer}
  .card:active{transform:scale(.985)}
  @media(hover:hover){.card:hover{border-color:var(--pc,var(--accent));transform:translateY(-1px)}}
  .card::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;
    background:var(--pc,var(--accent));opacity:.85}
  .card.st1::before{background:var(--warn)}
  .card.st2{background:var(--surface-2)}
  .c-body{flex:1;min-width:0}
  .c-title{font-size:14.5px;font-weight:700;line-height:1.4}
  .card.st2 .c-title{color:var(--muted)}
  .c-act{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-foot{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted)}
  .pill.st1{background:rgba(245,158,11,.16);color:#b45309}
  .pill.st2{background:rgba(16,185,129,.16);color:#047857}
  .pill.warn{background:rgba(245,158,11,.16);color:#b45309;
    flex:1 0 100%;min-width:0;white-space:normal;text-align:left;
    line-height:1.5;padding:5px 9px;border-radius:9px}
  [data-theme="dark"] .pill.warn{color:#fbbf24}
  [data-theme="dark"] .pill.st1{color:#fbbf24}
  [data-theme="dark"] .pill.st2{color:#34d399}

  /* ============ 抽屉 ============ */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
  .sheet-wrap.open{display:block}
  .sheet-bg{position:absolute;inset:0;background:rgba(12,14,30,.5);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .22s}
  .sheet-wrap.in .sheet-bg{opacity:1}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:var(--surface);border-radius:22px 22px 0 0;
    padding:8px 18px calc(var(--safe-b) + 24px);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-lg);
  }
  .sheet-wrap.in .sheet{transform:translateY(0)}
  @media(min-width:768px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:620px;max-width:calc(100vw - 48px);

const STORE_KEY="aippm_progress_v1";     // 键名保留，旧数据可无缝迁移
const PLAN_KEY ="aippm_plan_v2";
const DAYS_KEY ="aippm_days_v1";
const SESS_KEY ="aippm_sessions_v1";
const TIMER_KEY="aippm_timer_v1";
const THEME_KEY="aippm_theme";
const SET_KEY  ="aippm_settings_v1";
const RESET_KEY="aippm_reset_v1";
const READ_KEY="aippm_last_read";

let progress = {};          // id -> {st, ts, note}；理论卡自评为 0–3
let plan     = { weeks:{} }; // weeks[周一日期] -> {items:[id], goals:[], reflection, reviewedAt}
let days     = {};          // "YYYY-MM-DD" -> true（有实质推进的日子）
let sessions = [];          // [{uid, id, min, ts}]
let timer    = null;        // {id, endTs, min}
let settings = {focus:25};
let resetAt = 0;            // 「清空全部数据」的时刻，比它旧的记录一律丢弃（让清空能跨设备生效）
let activeTab = "map", lastReadId = "";
let mapPillar = "all", mapFilter = "all", mapQuery = "";

const STAGE_NAME=["未开始","学习中","已掌握"];
const THEORY_LEVELS=["未开始","已理解","能辨析","能迁移"];

/* ============ 持久化 ============ */
function dstr(d){ d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function loadAll(){
  lastReadId=localStorage.getItem(READ_KEY)||"";
  try{ progress=JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ progress={}; }
  // v1 迁移：{done:true, ts, note} -> {st:2, ts, note}
  let migrated=false;
  Object.keys(progress).forEach(k=>{
    const p=progress[k]; if(!p||typeof p!=="object") return;
    if(p.st===undefined){ p.st=p.done?2:0; delete p.done; delete p._open; migrated=true; }
    if(p.sts==null||p.nts==null){ progress[k]=normRec(p); migrated=true; }
  });
  try{ plan=JSON.parse(localStorage.getItem(PLAN_KEY)); if(!plan||!plan.weeks) plan={weeks:{}}; }
  catch(e){ plan={weeks:{}}; }
  // 从 v1 冲刺数据搬一次自定义目标
  try{
    const had=localStorage.getItem(PLAN_KEY);
    const old=JSON.parse(localStorage.getItem("aippm_plan_v1"));
    if(!had && old && old.weeks){
      Object.keys(old.weeks).forEach(k=>{
        const w=old.weeks[k];
        plan.weeks["old-"+k]=normalizeWeek({items:[],goals:(w.goals||[]),
          reflection:w.reflection||"",reviewedAt:w.reviewedAt||null});
      });
      localStorage.setItem(PLAN_KEY,JSON.stringify(plan));
    }
  }catch(e){}
  /* 一次性把所有周数据规范化成可合并结构（数组 → 时刻表），
     否则 rollover / 历史周这些直接读 plan.weeks[k] 的地方会拿到错形状。 */
  Object.keys(plan.weeks||{}).forEach(k=>{ normalizeWeek(plan.weeks[k]); });
  try{ days=JSON.parse(localStorage.getItem(DAYS_KEY))||{}; }catch(e){ days={}; }
  try{ sessions=JSON.parse(localStorage.getItem(SESS_KEY))||[]; }catch(e){ sessions=[]; }
  sessions.forEach((s,i)=>{ if(!s.uid) s.uid=(s.id||"x")+"|"+(s.ts||0)+"|"+i; });   // 旧数据补 uid
  try{ const s=JSON.parse(localStorage.getItem(SET_KEY)); if(s) settings=Object.assign(settings,s); }catch(e){}
  try{ resetAt=parseInt(localStorage.getItem(RESET_KEY),10)||0; }catch(e){ resetAt=0; }
  /* v2 的旧令牌键迁移到新的同步配置键 */
  try{
    const oldTok=localStorage.getItem("aippm_sync_token");
    if(oldTok && !localStorage.getItem(SY_KEY)){
      localStorage.setItem(SY_KEY, JSON.stringify({token:oldTok}));
      localStorage.removeItem("aippm_sync_token");
    }
  }catch(e){}
  try{ timer=JSON.parse(localStorage.getItem(TIMER_KEY)); }catch(e){ timer=null; }
  if(migrated) saveProgress(true);
}
function saveProgress(silent){ localStorage.setItem(STORE_KEY,JSON.stringify(progress)); if(!silent) schedulePush(); }
function savePlan(){ localStorage.setItem(PLAN_KEY,JSON.stringify(plan)); schedulePush(); }
function saveDays(){ localStorage.setItem(DAYS_KEY,JSON.stringify(days)); schedulePush(); }
function saveSessions(){ localStorage.setItem(SESS_KEY,JSON.stringify(sessions.slice(-400))); schedulePush(); }
function saveTimer(){ timer?localStorage.setItem(TIMER_KEY,JSON.stringify(timer)):localStorage.removeItem(TIMER_KEY); }
function saveSettings(){ settings.settingsAt=Date.now(); localStorage.setItem(SET_KEY,JSON.stringify(settings)); schedulePush(); }
function saveReset(){ localStorage.setItem(RESET_KEY,String(resetAt||0)); }

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const $$=s=>Array.prototype.slice.call(document.querySelectorAll(s));
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2200); }
function itemId(pid,gi,ii){ return pid+"-"+gi+"-"+ii; }
let _cache=null;
function ITEMS(){
  if(!_cache){
    _cache=[];
    [...THEORY,...PRACTICE,...LIBRARY].forEach(p=>p.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
      _cache.push({id:it.id||itemId(p.id,gi,ii),pillar:p,group:g,item:it,gi:gi,ii:ii});
    })));
  }
  return _cache;
}
function theoryItems(){ return ITEMS().filter(x=>x.item.topics); }
function byId(id){ const a=ITEMS(); for(let i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function stOf(id){ const p=progress[id]; return (p&&p.st!=null)?p.st:0; }
function isTheory(id){ return id.startsWith("theory-"); }
function levelsFor(id){ return isTheory(id)?THEORY_LEVELS:STAGE_NAME; }
function isMastered(id){ return stOf(id)===levelsFor(id).length-1; }
function noteOf(id){ return (progress[id]&&progress[id].note)||""; }
/* 单条进度记录的规范形态：
     st/sts  —— 状态与其发生时刻
     note/nts —— 笔记与其编辑时刻（独立时间戳，否则「手机改笔记、iPad 改状态」必丢一边）
     ts      —— 两者取大，仅供「今日推进 / 最近打卡」这类展示使用 */
function normRec(p){
  p=p||{};
  const ts=p.ts||0;
  if(p.sts==null&&p.nts==null){
    return { st:(p.st==null?0:p.st), sts:ts,
             note:p.note||"", nts:(p.note?ts:0), ts:ts };
  }
  const sts=p.sts||0, nts=p.nts||0;
  return { st:(p.st==null?0:p.st), sts:sts, note:p.note||"", nts:nts, ts:Math.max(sts,nts) };
}
function recOf(id){ return normRec(progress[id]); }
/* 只更新真正变化的字段，并各自盖时间戳 */
function writeRec(id,patch){
  const r=recOf(id);
  if(patch.st!=null && patch.st!==r.st){ r.st=patch.st; r.sts=Date.now(); }
  if(patch.note!=null && patch.note!==r.note){ r.note=patch.note; r.nts=Date.now(); }
  r.ts=Math.max(r.sts,r.nts);
  progress[id]=r;
  return r;
}
/* ============ 日期 / 周 ============ */
function todayKey(){ return dstr(new Date()); }
function mondayOf(d){ const t=new Date(d); t.setHours(0,0,0,0);
  const dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow); return t; }
function weekKey(){ return dstr(mondayOf(new Date())); }
function weekLabel(k){ const s=new Date(k+"T00:00:00"), e=new Date(s);
  e.setDate(e.getDate()+6);
  return (s.getMonth()+1)+"/"+s.getDate()+" – "+(e.getMonth()+1)+"/"+e.getDate(); }
/* 周数据的可合并结构：
     week.items : { [itemId]: 时刻 }   正数=已排入，负数=已移除（墓碑）
     week.goals : { [goalId]: {text,done,cts,ts,del} }
   用「墓碑」而不是直接删除，取消动作才能跨设备生效。 */
function normalizeWeek(w){
  if(!w) return w;
  if(Array.isArray(w.items)){
    const m={}, base=Date.now();
    w.items.forEach((id,i)=>{ if(id) m[id]=base+i; });
    w.items=m;
  }
  if(!w.items||typeof w.items!=="object") w.items={};
  if(Array.isArray(w.goals)){
    const m={};
    w.goals.forEach((g,i)=>{ if(!g||!g.id) return;
      m[g.id]={text:g.text||"",done:!!g.done,cts:g.cts||(i+1),ts:g.ts||(i+1),del:!!g.del}; });
    w.goals=m;
  }
  if(!w.goals||typeof w.goals!=="object") w.goals={};
  if(w.reflectionAt==null) w.reflectionAt=0;
  return w;
}
function weekItems(w){
  if(!w) return [];
  if(Array.isArray(w.items)) return w.items.slice();          // 兼容未迁移的旧格式
  const m=w.items||{};
  return Object.keys(m).filter(k=>m[k]>0).sort((a,b)=>m[b]-m[a]);
}
function weekGoals(w){
  if(!w) return [];
  if(Array.isArray(w.goals)) return w.goals.slice();          // 兼容未迁移的旧格式
  const m=w.goals||{};
  return Object.keys(m).map(k=>({id:k,text:m[k].text||"",done:!!m[k].done,
      cts:m[k].cts||m[k].ts||0,ts:m[k].ts||0}))
    .filter(g=>!m[g.id].del).sort((a,b)=>(a.cts-b.cts)||(a.ts-b.ts));
}

function countByStage(items=theoryItems()){ const c=[0,0,0,0]; items.forEach(x=>c[stOf(x.id)]++); return c; }
function weekActiveDays(){
  const start=weekKey(), end=todayKey();

function setStage(id,st){
  if(!byId(id)||!Number.isInteger(st)||st<0||st>=levelsFor(id).length) return;
  if(st===stOf(id)) return;
  writeRec(id,{st:st});
  if(st>=1&&isTheory(id)) markedDay();
  saveProgress();
  render();
  if(sheetId===id && $("#sheetWrap").classList.contains("open")) openSheet(id,true);
  toast("已记为「"+levelsFor(id)[st]+"」");

/* ============ 专注计时 ============ */
let ticker=null;
function recordFocus(id,min){
  const ts=Date.now();
  sessions.push({id,min,ts,uid:id+"|"+ts+"|"+Math.random().toString(36).slice(2,7)});
  saveSessions(); markedDay();
}
function startTimer(id,min){
  if(timer){ openTimerSheet(); return; }
  timer={id:id,endTs:Date.now()+min*60000,min:min};
  saveTimer(); tickTimer(); render();
  toast("专注 "+min+" 分钟，开始 🌱");
  if(sheetId===id) openSheet(id,true);
}
function stopTimer(silent){
  if(timer&&!silent){
    const used=Math.min(timer.min,Math.floor((Date.now()-(timer.endTs-timer.min*60000))/60000));
    if(used>=1){
      recordFocus(timer.id,used);
      toast("本次专注 "+used+" 分钟，已记录 ✓");
    }else toast("专注不足 1 分钟");
  }
  timer=null; saveTimer(); tickTimer(); render();
  if(sheetId) openSheet(sheetId,true);
}
function finishTimer(){
  const id=timer?timer.id:null, min=timer?timer.min:0;
  timer=null; saveTimer();
  if(id){
    recordFocus(id,min);
    toast("专注时间已记录");
    if(sheetId===id) openSheet(id,true);
  }
  tickTimer(); render();
}
function remainingMs(){ return timer?Math.max(0,timer.endTs-Date.now()):0; }
function fmtClock(ms){ const s=Math.ceil(ms/1000), m=Math.floor(s/60);
  return m+":"+String(s%60).padStart(2,"0"); }
function tickTimer(){
  const rem=remainingMs();
  $$(".timer-pill").forEach(el=>{
    if(timer){ el.classList.remove("hidden"); el.innerHTML='<span class="tp-dot"></span>'+fmtClock(rem); }
    else el.classList.add("hidden");
  });
  const d=$("#sheetTimerDisp"); if(d&&timer) d.textContent=fmtClock(rem);
  const b=$("#sheetTimerBar");
  if(b&&timer){ const total=timer.min*60000; b.style.width=Math.min(100,(total-rem)/total*100)+"%"; }
  if(timer&&rem<=0) finishTimer();
}
function tickLoop(){
  clearInterval(ticker);
  let day=todayKey();
  ticker=setInterval(()=>{
    const current=todayKey();
    if(current!==day){ day=current; render(); }
    else tickTimer();
  },1000);
  setInterval(paintSyncChip,60000);        // 「x 分钟前」要自己走
}

        sessions.forEach((s,i)=>{ if(!s.uid) s.uid=(s.id||"x")+"|"+(s.ts||0)+"|"+i; });
        if(d.resetAt) resetAt=Math.max(resetAt||0,d.resetAt);
        if(d.settings) settings=Object.assign(settings,d.settings);
      }else if(d&&typeof d==="object"){
        progress={};
        Object.keys(d).forEach(k=>{ const p=d[k]||{};
          progress[k]=normRec({st:p.done?2:(p.st||0),ts:p.ts||Date.now(),note:p.note||""}); });
      }else throw 0;
      saveProgress(true); savePlan(); saveDays(); saveSessions(); saveSettings();
      render(); toast("已导入 ⬆️");
    }catch(err){ toast("文件格式不对 ❌"); }
  };
  r.readAsText(file);
}
function resetAll(){
  if(!confirm("清空所有进度、笔记、计划与专注记录？此操作不可撤销。")) return;
  progress={}; plan={weeks:{}}; days={}; sessions=[]; timer=null;
  lastReadId=""; localStorage.removeItem(READ_KEY);
  resetAt=Date.now();                      // 让「清空」也能同步，否则另一台设备会把数据推回来

/* =====================================================================
   多端云同步（GitHub Contents API）
   —— 安全边界：代码里只内置 owner/repo/path，绝不内置 token。
      token 只存每台设备自己的 localStorage，且导出与同步载荷都必须剥离它。
   —— 合并策略：分层合并，不是「整条记录取较新」。
   ===================================================================== */
const SYNC_DEFAULTS={ owner:"KaraChenDS", repo:"ai-pm-progress", path:"progress.json" };
const SY_KEY="aippm_sync_v1";        // {owner,repo,path,token}
const SYNC_META_KEY="aippm_sync_meta_v1";  // {lastOk,lastTry,lastErr,lastMsg}

function syncSettings(){
  let j={}; try{ j=JSON.parse(localStorage.getItem(SY_KEY))||{}; }catch(e){ j={}; }
  return { owner:j.owner||SYNC_DEFAULTS.owner,
           repo: j.repo ||SYNC_DEFAULTS.repo,
           path: j.path ||SYNC_DEFAULTS.path,
           token:j.token||"" };
}
function saveSyncSettings(s){ localStorage.setItem(SY_KEY,JSON.stringify(s)); }
function syncToken(){ return syncSettings().token; }
function syncUrl(){
  const s=syncSettings();
  return "https://api.github.com/repos/"+encodeURIComponent(s.owner)+"/"+
         encodeURIComponent(s.repo)+"/contents/"+
         encodeURIComponent(s.path).replace(/%2F/g,"/");
}
function syHeaders(tok){ return { Authorization:"Bearer "+tok, Accept:"application/vnd.github+json" }; }
function b64enc(str){
  const b=new TextEncoder().encode(str); let s="";
  b.forEach(x=>{ s+=String.fromCharCode(x); }); return btoa(s);
}
function b64dec(s){
  const bin=atob(String(s).replace(/\s/g,"")); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}
/* 稳定序列化：键排序后比较，避免「键顺序不同」被误判成有变化 */
function stableStr(o){
  if(o===null||typeof o!=="object") return JSON.stringify(o);
  if(Array.isArray(o)) return "["+o.map(stableStr).join(",")+"]";
  return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stableStr(o[k])).join(",")+"}";
}

/* ============ 同步元信息（给 UI 看，失败必须留痕） ============ */
let syncMeta={lastOk:0,lastTry:0,lastErr:"",lastMsg:""};
function loadSyncMeta(){ try{ syncMeta=JSON.parse(localStorage.getItem(SYNC_META_KEY))||syncMeta; }catch(e){} }
function saveSyncMeta(){ localStorage.setItem(SYNC_META_KEY,JSON.stringify(syncMeta)); }
function syncMarkTry(){ syncMeta.lastTry=Date.now(); saveSyncMeta(); paintSyncChip(); }
function syncMarkOk(msg){ syncMeta.lastOk=Date.now(); syncMeta.lastErr=""; syncMeta.lastMsg=msg||"";
  saveSyncMeta(); paintSyncChip(); }
function syncMarkErr(err,code,msg){ syncMeta.lastErr=err||"未知错误"; syncMeta.lastCode=code||0;
  syncMeta.lastMsg=msg||""; syncMeta.lastTry=Date.now();
  saveSyncMeta(); paintSyncChip(); renderSyncBanner(); }
function syncHint(){ return syncMeta.lastErr ? syncHintFor(syncMeta.lastCode,syncMeta.lastErr) : ""; }
function agoText(ts){
  if(!ts) return "从未";
  const d=Math.floor((Date.now()-ts)/1000);
  if(d<10) return "刚刚"; if(d<60) return d+" 秒前";
  if(d<3600) return Math.floor(d/60)+" 分钟前";
  if(d<86400) return Math.floor(d/3600)+" 小时前";
  return Math.floor(d/86400)+" 天前";
}
/* 网络故障与令牌故障必须给不同文案，否则用户会把网络问题当成令牌配错 */
function netMsg(e){
  const m=String((e&&e.message)||e||"");
  if(/load failed|failed to fetch|networkerror|network request failed|fetch/i.test(m))
    return "连不上 api.github.com —— 网络被限制或需要代理，不是令牌问题";
  return "同步出错："+m;
}
function friendlyHttp(code,ctx){
  if(code===401) return "令牌无效或已过期（HTTP 401）";
  if(code===403) return "权限不足或触发限流（HTTP 403）";
  if(code===404){
    /* 关键：Fine-grained 令牌若没勾选该仓库，GitHub 返回 404 而不是 403 ——
       它不告诉你私有仓库是否存在。所以「写」时的 404 几乎总是权限问题。 */
    return (ctx==="write")
      ? "令牌看不到这个仓库，写入被拒（HTTP 404）"
      : "仓库或文件不存在（HTTP 404）";
  }
  if(code===409) return "与另一台设备同时写入，正在重试（HTTP 409）";
  return "HTTP "+code;
}
/* 针对错误码给出「下一步该做什么」，而不是只报一个码 */
function syncHintFor(code,msg){
  const s=syncSettings();
  if(code===404) return "Fine-grained 令牌如果没勾选这个仓库，GitHub 会返回 404 而不是 403。"+
    "请检查令牌的 Repository access 是否包含 "+s.owner+"/"+s.repo+"，权限是否为 Contents: Read and write。";
  if(code===401) return "令牌无效或已被吊销。去 GitHub 重新生成一个 Fine-grained PAT。";
  if(code===403) return "权限不足。确认令牌权限是 Contents: Read and write（只给 Read 会 403），"+
    "或稍等一会儿（可能是限流）。";
  if(code===409) return "两台设备同时写入，已自动重试。若持续失败，稍后再手动同步一次。";
  if(/连不上|网络/.test(msg||"")) return "先用手机 Safari 直接打开 https://api.github.com/ 确认。"+
    "中国大陆网络下 github.io 能开 ≠ api.github.com 能通，必要时挂代理。";
  return "点「🩺 诊断」逐环节检查。";
}

/* ============ 载荷与签名 ============ */
function payload(){
  return { v:3, updatedAt:Date.now(), resetAt:resetAt||0,
    progress:progress, plan:plan, days:days, sessions:sessions, settings:settings };
}
function stateSig(o){
  o=o||{};
  const ss=(o.sessions||[]).slice().sort((a,b)=>String(a.uid)<String(b.uid)?-1:1);
  return stableStr({ resetAt:o.resetAt||0, progress:o.progress||{},
    weeks:(o.plan&&o.plan.weeks)||{}, days:o.days||{}, sessions:ss, settings:o.settings||{} });
}
function localSig(){ return stateSig({resetAt:resetAt,progress:progress,plan:plan,days:days,sessions:sessions,settings:settings}); }
/* 兼容 v1 的 {updatedAt,data,plan} 载荷 */
function normalizePayload(raw){
  raw=raw||{};
  if(raw.v>=3||raw.progress){
    return { resetAt:raw.resetAt||0, progress:raw.progress||{}, plan:raw.plan||{weeks:{}},
             days:raw.days||{}, sessions:raw.sessions||[], settings:raw.settings||{} };
  }
  const prog={};
  Object.keys(raw.data||{}).forEach(k=>{ const p=raw.data[k]||{};
    prog[k]=normRec({st:p.done?2:(p.st||0),ts:p.ts||0,note:p.note||""}); });
  const weeks={}; const ow=(raw.plan&&raw.plan.weeks)||{};
  Object.keys(ow).forEach(k=>{ weeks[k]=normalizeWeek(JSON.parse(JSON.stringify(ow[k]))); });
  return { resetAt:0, progress:prog, plan:{weeks:weeks}, days:{}, sessions:[], settings:{} };
}

/* ============ 分层合并 ============ */
function mergeProgress(a,b){
  a=a||{}; b=b||{};
  const out={}, ids={};
  Object.keys(a).forEach(k=>{ ids[k]=1; }); Object.keys(b).forEach(k=>{ ids[k]=1; });
  Object.keys(ids).forEach(id=>{
    const x=a[id], y=b[id];
    if(!x){ out[id]=normRec(y); return; }
    if(!y){ out[id]=normRec(x); return; }
    const X=normRec(x), Y=normRec(y);
    /* 状态与笔记各按自己的时间戳取较新 —— 这是不丢数据的关键 */
    const st=(Y.sts>X.sts)?Y.st:(X.sts>Y.sts?X.st:((Y.st>X.st)?Y.st:X.st));
    let note;
    if(Y.nts>X.nts) note=Y.note;
    else if(X.nts>Y.nts) note=X.note;
    else note=((Y.note||"").length>(X.note||"").length?Y.note:X.note);  // 同时发生时不拿空值抹掉内容
    const sts=Math.max(X.sts,Y.sts), nts=Math.max(X.nts,Y.nts);
    out[id]={ st:st, sts:sts, note:note||"", nts:nts, ts:Math.max(sts,nts) };
  });
  return out;
}
/* 集合类字段逐键合并：正数=该时刻排入，负数=该时刻移除（墓碑） */
function mergeByTime(a,b){
  const A=a||{}, B=b||{};
  if(Array.isArray(A)||Array.isArray(B)){    // 兜底：万一还是老数组
    const m={}, base=Date.now();
    (Array.isArray(A)?A:Object.keys(A)).forEach((k,i)=>{ m[k]=Array.isArray(A)?base+i:1; });
    (Array.isArray(B)?B:Object.keys(B)).forEach((k,i)=>{ if(m[k]==null) m[k]=base+1000+i; });
    return m;
  }
  const out={}, ids={};
  Object.keys(A).forEach(k=>{ ids[k]=1; }); Object.keys(B).forEach(k=>{ ids[k]=1; });
  Object.keys(ids).forEach(k=>{
    const x=A[k], y=B[k];
    if(x===undefined) out[k]=y;
    else if(y===undefined) out[k]=x;
    else out[k]=Math.abs(y)>Math.abs(x)?y:x;
  });
  return out;
}
function mergePlan(a,b){
  const A=(a&&a.weeks)||{}, B=(b&&b.weeks)||{};
  const out={weeks:{}}, keys={};
  Object.keys(A).forEach(k=>{ keys[k]=1; }); Object.keys(B).forEach(k=>{ keys[k]=1; });
  Object.keys(keys).forEach(k=>{
    const x=A[k], y=B[k];
    if(!x){ out.weeks[k]=normalizeWeek(JSON.parse(JSON.stringify(y))); return; }
    if(!y){ out.weeks[k]=normalizeWeek(JSON.parse(JSON.stringify(x))); return; }
    const X=normalizeWeek(JSON.parse(JSON.stringify(x))), Y=normalizeWeek(JSON.parse(JSON.stringify(y)));
    const w={ items:mergeByTime(X.items,Y.items), goals:{},
      reflection:"", reflectionAt:0,
      reviewedAt:Math.max(X.reviewedAt||0,Y.reviewedAt||0)||null,
      rolledAt:Math.max(X.rolledAt||0,Y.rolledAt||0)||null };
    /* 目标：按 id 并集，同一 id 取较新的一版（含删除墓碑） */
    const gids={};
    Object.keys(X.goals||{}).forEach(g=>{ gids[g]=1; }); Object.keys(Y.goals||{}).forEach(g=>{ gids[g]=1; });
    Object.keys(gids).forEach(g=>{
      const p=X.goals[g], q=Y.goals[g];
      if(!p){ w.goals[g]=q; return; }
      if(!q){ w.goals[g]=p; return; }
      w.goals[g]=((q.ts||0)>=(p.ts||0))?q:p;
    });
    /* 复盘正文按自己的时间戳，且不让空值抹掉已有内容 */
    const xa=X.reflectionAt||0, ya=Y.reflectionAt||0;
    if(ya>xa){ w.reflection=Y.reflection||""; w.reflectionAt=ya; }
    else if(xa>ya){ w.reflection=X.reflection||""; w.reflectionAt=xa; }
    else{ w.reflection=((Y.reflection||"").length>(X.reflection||"").length?Y.reflection:X.reflection)||"";
          w.reflectionAt=xa; }
    out.weeks[k]=w;
  });
  return out;
}
function mergeSessions(a,b){
  const out={}, ids={};
  (a||[]).forEach(s=>{ if(s) ids[s.uid||((s.id||"x")+"|"+(s.ts||0))]=s; });
  const map2={};
  (b||[]).forEach(s=>{ if(s) map2[s.uid||((s.id||"x")+"|"+(s.ts||0))]=s; });
  Object.keys(map2).forEach(k=>{ if(!ids[k]) ids[k]=map2[k]; });
  return Object.keys(ids).map(k=>ids[k]);
}
function mergeSettings(a,b){
  a=a||{}; b=b||{};
  return ((b.settingsAt||0)>=(a.settingsAt||0)) ? Object.assign({},a,b) : Object.assign({},b,a);
}
/* 清空墓碑：比 resetAt 旧的记录一律丢弃 */
function applyReset(){
  if(!resetAt) return;
  Object.keys(progress).forEach(id=>{ const r=normRec(progress[id]);
    if(Math.max(r.sts,r.nts)<resetAt) delete progress[id]; else progress[id]=r; });
  Object.keys(days).forEach(k=>{ if(new Date(k+"T00:00:00").getTime()<resetAt) delete days[k]; });
  sessions=sessions.filter(s=>(s.ts||0)>=resetAt);
  // 旧打卡只存日期。清空当天，用清空之后的自评或专注重建该日记录。
  const resetDay=dstr(new Date(resetAt));
  if(sessions.some(s=>dstr(new Date(s.ts))===resetDay)||
    Object.values(progress).some(r=>r.st>0&&r.sts>=resetAt&&dstr(new Date(r.sts))===resetDay)){
    days[resetDay]=true;
  }
  Object.keys(plan.weeks||{}).forEach(k=>{
    const w=normalizeWeek(plan.weeks[k]);
    Object.keys(w.items).forEach(id=>{ if(Math.abs(w.items[id])<resetAt) delete w.items[id]; });
    Object.keys(w.goals).forEach(g=>{ if((w.goals[g].ts||0)<resetAt) delete w.goals[g]; });
  });
}
/* 把云端状态合并进本机，返回是否真的变了 */
function mergeRemoteState(rm){
  const before=localSig();
  if(rm.resetAt) resetAt=Math.max(resetAt||0, rm.resetAt);
  progress=mergeProgress(progress, rm.progress);
  Object.keys(rm.days||{}).forEach(k=>{ days[k]=true; });
  sessions=mergeSessions(sessions, rm.sessions);
  plan=mergePlan(plan, rm.plan);
  settings=mergeSettings(settings, rm.settings);
  applyReset();
  const after=localSig();
  if(before!==after){
    saveProgress(true); savePlan(); saveDays(); saveSessions(); saveSettings(); saveReset();
  }
  return before!==after;
}
/* 本机是否比云端更全 —— 拉取后据此回写，否则「连接前就有的本地数据」永远上不去 */
function needsPushBack(remoteData){
  return localSig() !== stateSig({
    resetAt:remoteData.resetAt||0, progress:remoteData.progress||{},
    plan:remoteData.plan||{weeks:{}}, days:remoteData.days||{},
    sessions:remoteData.sessions||[], settings:remoteData.settings||{} });
}

/* ============ 拉取 / 推送 ============ */
let syncing=false, pendingPush=null, pushTimer=null;
async function syncPull(opts){
  const silent=!!(opts&&opts.silent);
  const s=syncSettings();
  if(!s.token){ if(!silent) toast("还没配置同步令牌"); return; }
  if(syncing) return;
  syncing=true; syncMarkTry();
  try{
    const r=await fetch(syncUrl(),{headers:syHeaders(s.token),cache:"no-store"});
    if(r.status===404){                    // 云端还没有文件 → 用本机数据创建
      syncing=false;
      await syncPush(silent,true);
      return;
    }
    if(!r.ok){ const m=friendlyHttp(r.status,"read"); syncMarkErr(m,r.status);
      if(!silent) toast(m); syncing=false; return; }
    const j=await r.json();
    let remote;
    try{ remote=normalizePayload(JSON.parse(b64dec(j.content))); }
    catch(e){ syncMarkErr("云端文件不是合法 JSON",0); syncing=false; return; }
    const changed=mergeRemoteState(remote);
    if(changed) render();
    syncMarkOk("已合并云端");
    const need=needsPushBack(remote);
    syncing=false;
    if(need) await syncPush(silent);       // 合并后本机是超集，回写不会丢数据
    else if(!silent) toast("已是最新 ✓");
  }catch(e){
    syncing=false;
    syncMarkErr(netMsg(e),0);
    if(!silent) toast(netMsg(e));
  }
}
async function syncPush(silent,isCreate){
  const s=syncSettings();
  if(!s.token){ if(!silent) toast("还没配置同步令牌"); return; }
  syncMarkTry();
  try{
    let sha=null;
    const g=await fetch(syncUrl(),{headers:syHeaders(s.token),cache:"no-store"});
    if(g.ok){
      const j=await g.json();
      sha=j.sha;
      /* 关键：推送前先把云端并进本机。
         否则本机若停留在旧状态（例如防抖推送晚于另一台设备的写入），
         整文件覆盖会把对方的新数据抹掉。合并后本机是超集，写回一定安全。 */
      try{
        const remote=normalizePayload(JSON.parse(b64dec(j.content)));
        if(mergeRemoteState(remote)) render();
      }catch(e){}
    }
    else if(g.status!==404){ const m=friendlyHttp(g.status,"write"); syncMarkErr(m,g.status);
      if(!silent) toast(m); return; }
    const body={ message:"sync "+(isCreate?"init ":"")+new Date().toISOString(),
                 content:b64enc(JSON.stringify(payload())) };
    if(sha) body.sha=sha;
    const r=await fetch(syncUrl(),{method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"},syHeaders(s.token)),
      body:JSON.stringify(body)});
    if(r.ok){ syncMarkOk("已上传云端"); if(!silent) toast("已同步到云端 ✓"); return; }
    if(r.status===409){                     // 另一台设备刚写过 → 重拉再推一轮
      const rr=await fetch(syncUrl(),{headers:syHeaders(s.token),cache:"no-store"});
      if(rr.ok){
        const jj=await rr.json();
        const retry=await fetch(syncUrl(),{method:"PUT",
          headers:Object.assign({"Content-Type":"application/json"},syHeaders(s.token)),
          body:JSON.stringify({ message:"sync retry "+new Date().toISOString(),
            content:b64enc(JSON.stringify(payload())), sha:jj.sha })});
        if(retry.ok){ syncMarkOk("已上传云端（重试成功）"); return; }
      }
      syncMarkErr("与另一台设备同时写入，重试仍未成功",409);
      if(!silent) toast("同步冲突，稍后再试");
      return;
    }
    const m=friendlyHttp(r.status,"write");
    syncMarkErr(m,r.status); if(!silent) toast(m);
  }catch(e){ syncMarkErr(netMsg(e),0); if(!silent) toast(netMsg(e)); }
}
/* 任何改动都触发，防抖 2.5 秒 */
function schedulePush(){
  if(!syncToken()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ syncPush(true); }, 2500);
}

/* ============ 自动触发：无感知但可诊断 ============ */
function autoSync(){
  if(!syncToken()) return;
  if(document.visibilityState==="visible") syncPull({silent:true});
}
window.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") autoSync(); });
window.addEventListener("online",()=>{ autoSync(); });
window.addEventListener("focus",()=>{ autoSync(); });

/* ============ 新设备一键连接：#t=<token> ============ */
window.addEventListener("hashchange",()=>{
  if(bootstrapTokenFromHash()){ render(); syncPull({silent:true}); }
});
function bootstrapTokenFromHash(){
  const m=/[#&]t=([^&]+)/.exec(location.hash||"");
  if(!m) return false;
  try{
    const tok=decodeURIComponent(m[1]).trim();
    if(!tok) return false;
    saveSyncSettings(Object.assign({},syncSettings(),{token:tok}));
    history.replaceState(null,"",location.pathname+location.search);   // 立刻抹掉
    return true;
  }catch(e){ return false; }
}

/* ============ 诊断 ============ */
async function runDiagnostics(){
  const out=[]; const s=syncSettings();
  const line=t=>out.push(t);
  line("① 同步配置："+s.owner+"/"+s.repo+" → "+s.path);
  if(!s.token){ line("   ✕ 本机没有保存令牌 —— 先粘贴 Fine-grained PAT"); return out.join("\n"); }
  line("   ✓ 令牌已保存（"+s.token.slice(0,7)+"…"+s.token.slice(-4)+"，共 "+s.token.length+" 字符）");

  line("");
  line("② 能否访问 api.github.com");
  try{
    const r=await fetch("https://api.github.com/",{cache:"no-store"});
    line("   ✓ 有响应（HTTP "+r.status+"）—— 拿到任何响应都算网络通");
  }catch(e){
    line("   ✕ 连不上："+netMsg(e));
    line("     · github.io 能开 ≠ api.github.com 能通，两者常被分别处理");
    line("     · 用手机 Safari 直接打开 https://api.github.com/ 确认，必要时挂代理");
    return out.join("\n");
  }

  line("");
  line("③ 令牌本身是否有效");
  try{
    const r=await fetch("https://api.github.com/user",{headers:syHeaders(s.token),cache:"no-store"});
    if(r.status===401){ line("   ✕ 无效或已过期（401）—— 重新生成一个令牌"); return out.join("\n"); }
    if(r.status===403){ line("   ✕ 权限不足或限流（403）"); return out.join("\n"); }
    if(!r.ok){ line("   ✕ "+friendlyHttp(r.status)); return out.join("\n"); }
    const u=await r.json();
    line("   ✓ 有效（账号 "+u.login+"）");
  }catch(e){ line("   ✕ 请求失败："+netMsg(e)); return out.join("\n"); }

  line("");
  line("④ 令牌能否看到这个仓库（决定性的一步）");
  try{
    const rr=await fetch("https://api.github.com/repos/"+encodeURIComponent(s.owner)+"/"+encodeURIComponent(s.repo),
      {headers:syHeaders(s.token),cache:"no-store"});
    if(rr.status===404){
      line("   ✕ 看不到 "+s.owner+"/"+s.repo+"（404）");
      line("     · 这就是同步失败的原因。Fine-grained 令牌没勾选该仓库时，");
      line("       GitHub 返回 404 而不是 403 —— 它不告诉你私有仓库是否存在。");
      line("     · 去 GitHub → Settings → Developer settings → Fine-grained tokens");
      line("       → 编辑这个令牌 → Repository access 选 Only select repositories");
      line("       → 勾上 "+s.repo+" → 保存后回到这里重试");
      return out.join("\n");
    }
    if(!rr.ok){ line("   ✕ "+friendlyHttp(rr.status,"write")); return out.join("\n"); }
    const j=await rr.json();
    const canWrite=!!(j.permissions&&j.permissions.push);
    line("   ✓ 仓库可见："+j.full_name+"（"+(j.private?"private":"public")+"）");
    if(canWrite) line("   ✓ 有写入权限（permissions.push = true）");
    else{
      line("   ✕ 没有写入权限（permissions.push = false）");
      line("     · 去令牌设置里把 Contents 改为 Read and write");
      return out.join("\n");
    }
  }catch(e){ line("   ✕ 请求失败："+netMsg(e)); return out.join("\n"); }

  line("");
  line("⑤ 数据文件");
  try{
    const r=await fetch(syncUrl(),{headers:syHeaders(s.token),cache:"no-store"});
    if(r.status===404) line("   · 还不存在 —— 下次同步会用本机数据创建（正常）");
    else if(r.ok){ const j=await r.json();
      line("   ✓ 存在，约 "+(Math.round((j.size||0)/102.4)/10)+" KB"); }
    else line("   ✕ "+friendlyHttp(r.status));
  }catch(e){ line("   ✕ "+netMsg(e)); }

  line("");
  line("全部环节通过 ✓ 若仍失败，点「立即同步」看具体报错。");
  return out.join("\n");
}

/* ============ UI：状态胶囊与失败横幅 ============ */
function syncChipState(){
  if(!syncToken()) return {ic:"☁️",txt:"未连接",cls:"off"};
  if(syncMeta.lastErr) return {ic:"⚠️",txt:"同步异常",cls:"err"};
  if(syncing) return {ic:"🔄",txt:"同步中",cls:"busy"};
  return {ic:"☁️",txt:syncMeta.lastOk?agoText(syncMeta.lastOk):"待同步",cls:"ok"};
}
function paintSyncChip(){
  const st=syncChipState();
  $$(".sync-chip").forEach(el=>{
    const rail=el.classList.contains("rail-link");
    el.classList.remove("ok","err","busy","off");
    el.classList.add(st.cls);
    el.innerHTML= rail
      ? '<span class="rn-ic">'+st.ic+'</span><span class="sc-tx">'+esc(st.txt)+"</span>"
      : '<span class="sc-ic">'+st.ic+'</span><span class="sc-tx">'+esc(st.txt)+"</span>";
  });
}
function renderSyncBanner(){
  const el=$("#syncBanner");
  if(!el) return;
  if(activeTab!=="me"||mapPillar!=="all"||!syncToken()||!syncMeta.lastErr){ el.innerHTML=""; el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML='<div class="banner err" style="align-items:flex-start">'+
    '<div style="flex:1;min-width:200px">⚠️ 同步失败：'+esc(syncMeta.lastErr)+
    '<div style="font-weight:500;font-size:12.5px;opacity:.95;margin-top:5px;line-height:1.6">'+
    esc(syncHint())+'</div></div>'+
    '<button class="btn btn-sm" onclick="goTab(\'me\')">去设置</button>'+
    '<button class="btn btn-sm" onclick="manualSync()">重试</button></div>';
}
function manualSync(){ syncPull({silent:false}); }
function doSyncPull(){ syncPull({silent:false}); }
function doSyncPush(){ syncPush(false); }
function toggleSyncAuto(){ toast("现在同步是全自动的，切回前台会自动拉取"); }
function saveSyncToken(){
  const el=$("#syncToken"), val=el?el.value.trim():"";
  const cur=syncSettings();
  if(val){ saveSyncSettings(Object.assign({},cur,{token:val})); toast("令牌已保存，正在同步…"); syncPull({silent:true}); }
  else{ saveSyncSettings(Object.assign({},cur,{token:""})); toast("已断开同步（本机数据保留）"); }
  render();
}
function saveSyncRepo(){
  const o=$("#syOwner"), r=$("#syRepo"), p=$("#syPath");
  const cur=syncSettings();
  saveSyncSettings(Object.assign({},cur,{
    owner:(o&&o.value.trim())||SYNC_DEFAULTS.owner,
    repo:(r&&r.value.trim())||SYNC_DEFAULTS.repo,
    path:(p&&p.value.trim())||SYNC_DEFAULTS.path }));
  toast("仓库配置已保存"); render();
}
/* 生成给新设备用的一键连接链接（令牌会留在聊天记录里，用完即弃更稳妥） */
function connectLink(){
  const s=syncSettings();
  if(!s.token){ toast("先在本机配置令牌"); return; }
  const url=location.origin+location.pathname+"#t="+encodeURIComponent(s.token);
  const done=()=>toast("连接链接已复制，在另一台设备打开即可");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>{ prompt("复制这条链接到另一台设备打开：",url); });
  }else prompt("复制这条链接到另一台设备打开：",url);
}
async function showDiagnostics(){
  const box=$("#diagOut");
  if(!box) return;
  box.textContent="正在逐环节检查…";
  box.textContent=await runDiagnostics();
}

/* ============ 同步设置面板 ============ */
function syncPanelHtml(){
  const s=syncSettings();
  const st=syncChipState();
  const linked=!!s.token;
  return `<details class="acc" style="margin-top:12px" ${linked?"":"open"}>
    <summary>☁️ 多端云同步
      <span style="margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)">
        ${linked?("已连接 · "+(syncMeta.lastOk?agoText(syncMeta.lastOk):"待同步")):"未连接 · 可选"}</span></summary>
    <div class="acc-body">
      <div class="note" style="margin-bottom:12px">
        数据默认只存在<b>本设备浏览器</b>，不配置也能正常用。<br/>
        想让手机 / iPad / 电脑看到同一份进度，就连接一次。
      </div>

      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input class="field" type="password" id="syncToken" style="flex:1;min-width:0"
          placeholder="${linked?"已配置（重新粘贴可替换）":"粘贴 GitHub Fine-grained PAT"}" value="${esc(s.token)}"/>
        <button class="btn btn-primary btn-sm" style="flex:0 0 auto" onclick="saveSyncToken()">保存</button>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn btn-line btn-sm" onclick="manualSync()">🔄 立即同步</button>
        <button class="btn btn-line btn-sm" onclick="connectLink()">🔗 复制新设备连接链接</button>
        <button class="btn btn-line btn-sm" onclick="showDiagnostics()">🩺 诊断</button>
      </div>

      ${linked?`<div class="note" style="margin-bottom:12px">
        状态：<b>${st.ic} ${esc(st.txt)}</b><br/>
        上次成功：<b>${syncMeta.lastOk?agoText(syncMeta.lastOk)+"（"+dstr(new Date(syncMeta.lastOk))+"）":"从未"}</b><br/>
        ${syncMeta.lastErr?('上次失败：<b style="color:#dc2626">'+esc(syncMeta.lastErr)+"</b><br/>"+
          '<span style="display:block;background:rgba(245,158,11,.13);border-radius:10px;padding:9px 11px;margin:7px 0;color:#b45309;font-weight:600">'+
          esc(syncHint())+"</span>"):""}
        同步是自动的：打开应用、切回前台、联网、以及任何改动后 2.5 秒。
      </div>`:""}

      <pre id="diagOut" class="diag"></pre>

      <details class="acc" style="box-shadow:none;margin-top:10px">
        <summary style="padding:10px 0;min-height:auto;font-size:13px">⚙️ 存储位置（一般不用改）</summary>
        <div style="padding-top:10px">
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input class="field" id="syOwner" placeholder="owner" style="flex:1;min-width:0" value="${esc(s.owner)}"/>
            <input class="field" id="syRepo" placeholder="repo" style="flex:1;min-width:0" value="${esc(s.repo)}"/>
          </div>
          <div style="display:flex;gap:8px">
            <input class="field" id="syPath" placeholder="path" style="flex:1;min-width:0" value="${esc(s.path)}"/>
            <button class="btn btn-line btn-sm" style="flex:0 0 auto" onclick="saveSyncRepo()">保存</button>
          </div>
        </div>
      </details>

      <div class="note" style="margin-top:12px">
        数据存于<b>私有仓库</b> ${esc(s.owner)}/${esc(s.repo)}，仅你可见。<br/>
        令牌只存本机浏览器，<b>不会写进代码、也不会进导出文件</b>。<br/><br/>
        建令牌：GitHub → Settings → Developer settings → Fine-grained tokens →
        只勾仓库 <b>${esc(s.repo)}</b> → 权限 <b>Contents: Read and write</b>。
      </div>
    </div>
  </details>`;
}

/* ============ 启动 ============ */
function bindStatic(){
  $$(".theme-btn").forEach(b=>{ b.onclick=toggleTheme; });
  $("#fileInput").onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
  window.addEventListener("scroll",()=>{
    const b=$("#appbar"); if(b) b.classList.toggle("stuck",window.scrollY>4);
  },{passive:true});
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
}
(function init(){
  const saved=localStorage.getItem(THEME_KEY)||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme",saved);
  setThemeIcon(saved);
  loadSyncMeta();
  const linked=bootstrapTokenFromHash();     // #t=<token> 一键连接
  loadAll(); bindStatic(); render(); tickLoop();
  if(timer&&remainingMs()<=0) finishTimer();
  if("serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  }
  if(syncToken()){
    if(linked) toast("已连接，正在同步…");
    syncPull({silent:true});
  }
})();
</script>
</body>
</html>
