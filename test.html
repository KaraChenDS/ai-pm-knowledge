<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>自测 · AI 产品经理知识体系</title>
<style>
  :root{--ok:#047857;--bad:#dc2626;--bg:#f4f5fb;--tx:#16182b;--mu:#6b7089;--bd:#e7e9f4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--mu);margin-bottom:18px}
  .bar{height:10px;border-radius:6px;background:#e7e9f4;overflow:hidden;margin-bottom:6px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .25s}
  .sum{font-size:14px;font-weight:700;margin-bottom:16px}
  .sum.pass{color:var(--ok)} .sum.fail{color:var(--bad)}
  .phase{font-size:13px;font-weight:800;color:#4f46e5;margin:18px 0 7px;
    padding-top:12px;border-top:1px solid var(--bd)}
  .t{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:5px 0 5px 4px}
  .t .i{flex:0 0 auto;font-weight:800}
  .t.ok .i{color:var(--ok)} .t.no .i{color:var(--bad)}
  .t.no{background:#fef2f2;border-radius:7px;padding-left:8px}
  .t.no .m{color:var(--bad);font-weight:600}
  .note{font-size:12px;color:var(--mu);margin-top:20px;padding-top:14px;border-top:1px solid var(--bd)}
  iframe{position:absolute;left:-9999px;top:0;width:390px;height:820px;border:0}
  code{background:#fff;border:1px solid var(--bd);border-radius:5px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>自测 · AI 产品经理知识体系</h1>
  <div class="sub">在真实浏览器里跑 <code>index.html</code>，逐项断言核心逻辑。每项测试都会重新加载应用，走真实的启动路径。</div>
  <div class="bar"><i id="pg"></i></div>
  <div class="sum" id="sum">准备中…</div>
  <div id="out"></div>
  <div class="note">
    需要本地服务器（同源 iframe 才能互相访问）：<br/>
    <code>python3 -m http.server 8912 --bind 127.0.0.1</code> → 打开 <code>http://127.0.0.1:8912/test.html</code>
  </div>
</div>
<iframe id="app" src="index.html"></iframe>
<script>
/* ================= 测试框架 ================= */
var FRAME=document.getElementById('app');
var OUT=document.getElementById('out'), SUM=document.getElementById('sum'), PG=document.getElementById('pg');
var RESULTS=[], PHASES=[], idx=0, started=false;

function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayKey(off){
  var t=new Date(); t.setHours(0,0,0,0);
  var dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow+off*7);
  return dstr(t);
}
function phase(name,seed,check){ PHASES.push({name:name,seed:seed,check:check}); }

function waitReady(cb,tries){
  tries=tries||0;
  var w=FRAME.contentWindow;
  var ready=false;
  try{ ready = !!(w && w.ITEMS && typeof w.ITEMS==='function' && w.document.getElementById('view')
                  && w.document.getElementById('view').innerHTML.length>50); }catch(e){}
  if(ready) return setTimeout(cb,60);
  if(tries>60) return cb();          // 超时也继续，断言会自然失败
  setTimeout(function(){ waitReady(cb,tries+1); },50);
}

function runPhase(){
  if(idx>=PHASES.length) return done();
  var p=PHASES[idx++];
  var w=FRAME.contentWindow;
  w.localStorage.clear();
  if(p.seed) Object.keys(p.seed).forEach(function(k){ w.localStorage.setItem(k,p.seed[k]); });
  FRAME.addEventListener('load', function(){
    waitReady(function(){
      var rows=[];
      try{ rows=p.check(w)||[]; }
      catch(e){ rows=[['执行异常：'+e.message,false]]; }
      rows.forEach(function(r){ RESULTS.push({phase:p.name,name:r[0],ok:!!r[1]}); });
      paint();
      runPhase();
    });
  }, {once:true});
  FRAME.src='index.html?test='+idx;
}

function paint(){
  var groups={},order=[];
  RESULTS.forEach(function(r){
    if(!groups[r.phase]){ groups[r.phase]=[]; order.push(r.phase); }
    groups[r.phase].push(r);
  });
  var pass=RESULTS.filter(function(r){return r.ok;}).length;
  var total=RESULTS.length;
  var html='';
  order.forEach(function(g){
    var gp=groups[g].filter(function(r){return r.ok;}).length;
    html+='<div class="phase">'+g+' &nbsp;'+gp+'/'+groups[g].length+'</div>';
    groups[g].forEach(function(r){
      html+='<div class="t '+(r.ok?'ok':'no')+'"><span class="i">'+(r.ok?'✓':'✕')+'</span><span class="m">'+r.name+'</span></div>';
    });
  });
  OUT.innerHTML=html;
  SUM.textContent='已完成 '+total+' 项断言 · 通过 '+pass+' · 失败 '+(total-pass);
  SUM.className='sum '+(total-pass===0&&total>0?'pass':'fail');
  PG.style.width=Math.min(100, (idx/PHASES.length)*100)+'%';
  window.__RESULT__={pass:pass,total:total};
}

function done(){
  var pass=RESULTS.filter(function(r){return r.ok;}).length, total=RESULTS.length;
  PG.style.width='100%';
  SUM.textContent='全部完成：'+total+' 项断言 · 通过 '+pass+' · 失败 '+(total-pass);
  SUM.className='sum '+(total-pass===0?'pass':'fail');
  window.__RESULT__={pass:pass,total:total};
  document.title='RESULT '+pass+'/'+total;
}

/* ================= 断言用例 ================= */

/* 1. 数据完整性 */
phase('数据完整性', null, function(w){
  var it=w.ITEMS();
  var ids={},dup=0; it.forEach(function(x){ if(ids[x.id])dup++; ids[x.id]=1; });
  return [
    ['63 项旧资料、18 项选修实操、14 项必修', it.length===95 && w.theoryItems().length===14],
    ['知识点 ID 唯一', dup===0],
    ['每张必修卡有四个带解释的子知识点、学习深度、延伸范围和学成目标', w.theoryItems().every(function(x){return x.item.topics.length===4 && x.item.topics.every(function(pair){return pair[0] && pair[1].length>10;}) && [x.item.depth,x.item.later,x.item.goal].every(function(v){return v.length>10;});})],
    ['ID 规则与 v1 一致（hard-0-0）', w.itemId('hard',0,0)==='hard-0-0'],
    ['实操卡保留第一步', it.filter(function(x){return !x.item.topics;}).every(function(x){return x.item.a&&x.item.a.length>8;})],
    ['理论卡有案例，实操卡有验收标准', it.every(function(x){return x.item.topics ? !!(x.item.case&&x.item.answer) : x.item.k&&x.item.k.length>6;})],
    ['每项都有「搜索关键词」', it.every(function(x){return x.item.q&&x.item.q.length>2;})],
    ['每项都有「权威入口」', it.every(function(x){return x.item.s&&x.item.s.length>3;})],
    ['每项都有时长估计（≥15 分钟）', it.every(function(x){return x.item.m>=15;})],
    ['三大支柱各有知识点', ['hard','soft','practice'].every(function(p){
        return it.filter(function(x){return x.pillar.id===p;}).length>0; })]
  ];
});

/* 2. v1 数据迁移 */
phase('v1 数据迁移', {
  'aippm_progress_v1': JSON.stringify({
    'hard-0-0':{done:true, ts:12345, note:'旧笔记'},
    'hard-0-1':{done:false, ts:999}
  })
}, function(w){
  return [
    ['{done:true} 迁移为「已掌握」st=2', w.stOf('hard-0-0')===2],
    ['未完成的项保持 st=0', w.stOf('hard-0-1')===0],
    ['旧笔记完整保留', w.noteOf('hard-0-0')==='旧笔记'],
    ['旧进度仍可查看，理论卡独立记录', w.byId('hard-0-0').item.t==='机器学习核心概念' && w.stOf('theory-value')===0]
  ];
});


phase('理论自评', null, function(w){
  w.setStage('theory-value',1);
  var p1=w.stOf('theory-value');
  w.setStage('theory-value',2);
  var p2=w.stOf('theory-value'), notMastered=!w.isMastered('theory-value');
  w.setStage('theory-value',3);
  w.loadAll();
  var p3=w.stOf('theory-value'), mastered=w.isMastered('theory-value');
  w.setStage('theory-value',0);
  return [
    ['已理解记为状态 1', p1===1],
    ['能辨析独立记录', p2===2 && notMastered],
    ['能迁移重载后保留', p3===3 && mastered],
    ['可回退为未开始', w.stOf('theory-value')===0]
  ];
});

/* 4. 专注计时全流程 */
phase('专注计时', null, function(w){
  w.startTimer('theory-value',25);
  var pill=w.document.querySelector('.timer-pill');
  var running=pill && !pill.classList.contains('hidden');
  var rem=w.remainingMs();
  w.finishTimer();
  var pill2=w.document.querySelector('.timer-pill');
  return [
    ['开始后顶栏出现计时胶囊', !!running],
    ['剩余时间≈25 分钟', rem>24*60000 && rem<=25*60000],
    ['结束后计时器清空', w.remainingMs()===0],
    ['结束后胶囊隐藏', pill2 && pill2.classList.contains('hidden')],
    ['阅读计时不自动修改理论自评', w.stOf('theory-value')===0],
    ['结束后记录 25 分钟专注', w.payload().sessions[0].min===25],
    ['结束后计入本周打卡', w.weekActiveDays()===1]
  ];
});



phase('提前结束专注与放弃', null, function(w){
  function seedTimer(elapsed){
    w.localStorage.setItem('aippm_timer_v1',JSON.stringify({
      id:'theory-value',min:15,endTs:Date.now()+15*60000-elapsed
    }));
    w.loadAll();
  }
  seedTimer(30000);
  w.stopTimer(false);
  var shortIgnored=w.weekActiveDays()===0 && w.payload().sessions.length===0;
  seedTimer(120000);
  w.stopTimer(true);
  var canceledIgnored=w.weekActiveDays()===0 && w.payload().sessions.length===0;
  seedTimer(120000);
  w.stopTimer(false);
  return [
    ['不足一分钟不记入打卡或专注', shortIgnored],
    ['放弃计时不记入打卡或专注', canceledIgnored],
    ['有效专注可提前结束并计入打卡', w.weekActiveDays()===1 && w.payload().sessions[0].min===2]
  ];
});

phase('继续阅读与每周打卡', (function(){
  var old=mondayKey(-1), future=new Date();
  future.setDate(future.getDate()+1);
  return {'aippm_days_v1':JSON.stringify({[old]:true,[dstr(future)]:true})};
})(), function(w){
  var doc=w.document;
  var initial=doc.querySelector('#continueReading').textContent;
  var onlyCurrent=w.weekActiveDays()===0;
  w.openSheet('theory-harness');
  w.loadAll();
  w.goTab('map');
  var bookmark=doc.querySelector('#continueReading').textContent;
  w.setStage('theory-harness',1);
  w.setStage('theory-harness',2);
  w.startTimer('theory-harness',15);
  w.finishTimer();
  var countAfter=w.weekActiveDays(), kpi=doc.querySelector('#weekKpi').textContent;
  return [
    ['首次阅读从地图第一项开始', initial==='任务价值与可验证性'],
    ['继续阅读记住最近打开的理论卡', bookmark==='Agent 与 Harness 的分工'],
    ['上周与未来日期不计入本周', onlyCurrent],
    ['同一天多次自评与专注只打卡一次', countAfter===1],
    ['地图顶部显示 5 天目标与当前值', kpi.includes('1 / 5 天')],
    ['完成专注不改动已有自评', w.stOf('theory-harness')===2]
  ];
});

phase('旧周计划只读归档', {'aippm_plan_v2':JSON.stringify({weeks:{
  [mondayKey(-1)]:{items:['theory-value','soft-0-0'],goals:[{id:'g1',text:'旧目标',done:true}],reflection:'保留的复盘正文'}
}})}, function(w){
  w.goTab('me');
  var doc=w.document, view=doc.getElementById('view');
  var archived=view.textContent.includes('旧目标') && view.textContent.includes('保留的复盘正文');
  var item=Array.from(view.querySelectorAll('details button')).find(function(el){return el.textContent==='任务价值与可验证性';});
  item.click();
  var sheet=doc.getElementById('sheet');
  return [
    ['设置可查阅旧周目标与周复盘原文', archived],
    ['旧周计划可打开原卡并以只读方式显示', sheet.querySelector('#noteField').readOnly && !sheet.querySelector('.stage-btn')],
    ['旧周计划没有排课或滚入操作', !view.textContent.includes('滚入本周') && !view.textContent.includes('自动排')]
  ];
});

phase('理论地图、选修与资料库', {'aippm_progress_v1':JSON.stringify({
  'hard-1-2':{done:true,ts:123,note:'原来的 RAG 笔记'},
  'project-prototype':{st:2,sts:111,note:'原型链接',nts:112,ts:112}
})}, function(w){
  w.goTab('map');
  var view=w.document.getElementById('view');
  var stages=Array.from(view.querySelectorAll('.pcard h3')).map(function(el){return el.textContent;});
  var mainOnly=!view.textContent.includes('交付可运行原型') && view.textContent.includes('Agent 与 Harness 的分工');
  w.pickPillar('execute');
  var mapPreview=view.textContent.includes('状态、超时与恢复');
  w.onMapSearch('检查点');
  var matchesTopic=view.querySelectorAll('.card').length===1 && view.textContent.includes('Agent 与 Harness 的分工');
  w.onMapSearch('');
  w.openSheet('theory-harness');
  var sheet=w.document.getElementById('sheet'), answer=sheet.querySelector('.case-answer');
  var coreLabels=Array.from(sheet.querySelectorAll('.theory-copy .ab-label')).map(function(el){return el.textContent;});
  var theoryContent=coreLabels.join('|')==='这一项具体学什么|学到多深|学成目标';
  var extra=Array.from(sheet.querySelectorAll('.sheet-extra'));
  var optionalCollapsed=extra.length===3 && extra.every(function(el){return !el.open;});
  var answerHidden=!answer.open;
  sheet.querySelector('#sheetCase summary').click();
  answer.querySelector('summary').click();
  var answerRevealed=answer.open;
  w.setStage('theory-harness',2);
  w.setMapFilter('distinguish');
  var onlyDistinguished=view.querySelectorAll('.card').length===1 && view.textContent.includes('Agent 与 Harness 的分工');
  w.pickPillar('practice');
  w.setMapFilter('done');
  var keptPractice=view.textContent.includes('交付可运行原型') && w.noteOf('project-prototype')==='原型链接';
  w.pickPillar('library');
  w.setMapFilter('done');
  return [
    ['四阶段顺序保留', stages.join(' → ')==='选场景 → 设计任务 → 接入与执行 → 评测上线'],
    ['主线呈现理论卡，项目交付物放在选修', mainOnly],
    ['地图预览子知识点并支持搜索正文', mapPreview && matchesTopic],
    ['理论卡正文只展示三个核心问题', theoryContent],
    ['案例、延伸阅读和学习工具默认折叠', optionalCollapsed],
    ['参考判断默认折叠，可主动打开', answerHidden && answerRevealed],
    ['可单独筛出已标记能辨析的知识点', onlyDistinguished],
    ['选修卡保留原实操进度和笔记', keptPractice],
    ['资料库保留旧记录', view.textContent.includes('RAG 检索增强生成') && w.noteOf('hard-1-2')==='原来的 RAG 笔记'],
    ['归档卡片仅供查阅', (w.openSheet('hard-1-2'), sheet.querySelector('#noteField').readOnly)]
  ];
});


phase('导航与设置', null, function(w){
  var doc=w.document;
  var nav=Array.from(doc.querySelectorAll('#bottomNav button')).map(function(el){return el.textContent.trim().replace(/\s+/g,' ');});
  var isMap=doc.getElementById('abTitle').textContent==='学习地图' && !!doc.getElementById('weekKpi');
  w.goTab('me');
  var view=doc.getElementById('view');
  var settingsOnly=['历史资料','多端云同步','导出备份'].every(function(text){return view.textContent.includes(text);});
  var before=doc.documentElement.dataset.theme;
  var themeButton=Array.from(view.querySelectorAll('button')).find(function(el){return el.textContent.includes('深浅色');});
  themeButton.click();
  return [
    ['默认首页是学习地图', isMap],
    ['导航仅有学习地图和设置', nav.length===2 && nav[0].includes('学习地图') && nav[1].includes('设置')],
    ['设置包含同步、备份和历史资料', settingsOnly],
    ['设置中可切换深浅色', doc.documentElement.dataset.theme!==before]
  ];
});

/* 10.7 同步：合并语义（最易做错的部分） */
phase('同步合并 · 状态与笔记各自独立', null, function(w){
  var a={x:{st:2,sts:1000,note:'A 写的笔记',nts:1000,ts:1000}};
  var b={x:{st:0,sts:2000,note:'',nts:0,ts:2000}};
  var m=w.mergeProgress(a,b);
  return [
    ['状态取较新的一侧（取消生效）', m.x.st===0],
    ['笔记按自己的时间戳保留，不被空值抹掉', m.x.note==='A 写的笔记'],
    ['sts / nts 各自独立保留', m.x.sts===2000 && m.x.nts===1000]
  ];
});

phase('同步合并 · 两台设备各改同一项的不同部分', null, function(w){
  var a={x:{st:0,sts:5000,note:'',nts:0,ts:5000}};          // A 取消了掌握
  var b={x:{st:2,sts:1000,note:'B 补充的笔记',nts:6000,ts:6000}}; // B 补了笔记
  var m=w.mergeProgress(a,b);
  return [
    ['较新的状态获胜', m.x.st===0],
    ['较新的笔记获胜', m.x.note==='B 补充的笔记'],
    ['两边都没丢', m.x.st===0 && m.x.note==='B 补充的笔记']
  ];
});

phase('同步合并 · 墓碑让「取消排入」跨设备生效', null, function(w){
  var m=w.mergeByTime({itemA:100,itemB:200},{itemA:-300});
  return [
    ['较新的移除（负值）胜出', m.itemA===-300],
    ['未被移除的键保留', m.itemB===200],
    ['已经移除的不会复活', w.mergeByTime({itemA:-300},{itemA:100}).itemA===-300]
  ];
});

phase('同步合并 · 目标并集与删除墓碑', null, function(w){
  var a={weeks:{W:{items:{},goals:{g1:{text:'甲',done:false,cts:1,ts:1,del:false}}}}};
  var b={weeks:{W:{items:{},goals:{
      g1:{text:'甲',done:true,cts:1,ts:9,del:false},
      g2:{text:'乙',done:false,cts:2,ts:2,del:false},
      g3:{text:'丙',done:false,cts:3,ts:3,del:false}}}}};
  var m=w.mergePlan(a,b);
  var g=m.weeks.W.goals;
  var m2=w.mergePlan(m,{weeks:{W:{items:{},goals:{g2:{text:'乙',done:false,cts:2,ts:20,del:true}}}}});
  return [
    ['目标取并集', Object.keys(g).length===3],
    ['同一目标取较新版本', g.g1.done===true],
    ['删除墓碑生效', m2.weeks.W.goals.g2.del===true],
    ['删除只影响被删的那个', !!m2.weeks.W.goals.g1 && !!m2.weeks.W.goals.g3]
  ];
});

phase('同步合并 · 会话按 uid 去重并集', null, function(w){
  var a=[{uid:'u1',id:'x',min:25,ts:1}];
  var b=[{uid:'u1',id:'x',min:25,ts:1},{uid:'u2',id:'x',min:45,ts:2}];
  var m=w.mergeSessions(a,b);
  return [
    ['按 uid 去重', m.length===2],
    ['不同会话都保留', m.filter(function(s){return s.uid==='u2';}).length===1]
  ];
});

phase('同步 · 清空全部数据可以跨设备生效', {
  'aippm_progress_v1': JSON.stringify({
    old1:{st:2,sts:1000,note:'',nts:0,ts:1000},
    old2:{st:2,sts:2000,note:'',nts:0,ts:2000}})
}, function(w){
  var before=w.stOf('old1')+w.stOf('old2');
  w.mergeRemoteState({resetAt:Date.now(),progress:{},plan:{weeks:{}},days:{},sessions:[],settings:{}});
  return [
    ['清空前两条都在', before===4],
    ['清空后比 resetAt 旧的记录被丢弃', w.stOf('old1')===0 && w.stOf('old2')===0]
  ];
});

phase('同步兼容 · v1 云端载荷可被解析', null, function(w){
  var v1={updatedAt:123,data:{'hard-0-0':{done:true,ts:500,note:'老笔记'}},plan:{weeks:{}}};
  var n=w.normalizePayload(v1);
  return [
    ['v1 的 data 映射为 progress', !!n.progress['hard-0-0']],
    ['done:true 解析为已掌握', n.progress['hard-0-0'].st===2],

  ];
});

/* 11. 横向溢出（390px 真实宽度 · 逐个视图扫描） */
phase('390px 无横向溢出', null, function(w){
  // 只统计「真的会撑破页面」的元素：被祖先 overflow:hidden/auto 裁剪的不算
  function clipped(el,de){
    var p=el.parentElement;
    while(p && p!==de){
      var cs=w.getComputedStyle(p);
      if(cs.overflowX!=='visible'||cs.overflowY!=='visible') return true;
      p=p.parentElement;
    }
    return false;
  }
  function scan(){
    var de=w.document.documentElement, bad=[];
    de.querySelectorAll('*').forEach(function(el){
      var r=el.getBoundingClientRect();
      if((r.right>de.clientWidth+0.5||r.left<-0.5) && !clipped(el,de)){
        bad.push(String(el.className||el.tagName).slice(0,26)+'→'+Math.round(r.right));
      }
    });
    return {w:de.scrollWidth,c:de.clientWidth,bad:bad};
  }
  var res=[], t=scan();
  res.push(['首页 · 文档宽度 = 视口宽度', t.w<=t.c+1]);
  res.push(['首页 · 无元素溢出', t.bad.length===0]);
  res.push(['底部导航有 2 个标签', w.document.querySelectorAll('.bottomnav button').length===2]);

  w.goTab('map'); var m=scan();
  res.push(['地图首页 · 无元素溢出', m.bad.length===0]);
  if(m.bad.length) res.push(['溢出元素：'+m.bad.slice(0,4).join(' | '), false]);

  w.pickPillar('execute'); var d=scan();
  res.push(['地图·接入与执行列表· 无元素溢出', d.bad.length===0]);
  if(d.bad.length) res.push(['溢出元素：'+d.bad.slice(0,4).join(' | '), false]);

  w.openSheet('theory-mcp'); var s=scan();
  res.push(['知识点抽屉 · 无元素溢出', s.bad.length===0]);
  if(s.bad.length) res.push(['溢出元素：'+s.bad.slice(0,4).join(' | '), false]);
  w.closeSheet();

  w.goTab('me'); var me=scan();
  res.push(['设置页· 无元素溢出', me.bad.length===0]);
  if(me.bad.length) res.push(['溢出元素：'+me.bad.slice(0,4).join(' | '), false]);

  // 折叠面板默认不渲染子元素，必须展开后再扫一次，否则是测试盲区
  w.saveSyncSettings({owner:'KaraChenDS',repo:'ai-pm-progress',path:'progress.json',token:'gho_test_token_1234567890'});
  w.goTab('me');
  Array.prototype.forEach.call(w.document.querySelectorAll('details.acc'), function(d){ d.open = true; });
  const dg=w.document.getElementById('diagOut');
  if(dg) dg.textContent='① 同步配置：KaraChenDS/ai-pm-progress → progress.json\n   ✓ 令牌已保存\n② 测试 api.github.com …\n   ✓ 有响应（HTTP 200）';
  var sy=scan();
  res.push(['展开的同步面板 · 无元素溢出', sy.bad.length===0]);
  if(sy.bad.length) res.push(['溢出元素：'+sy.bad.slice(0,4).join(' | '), false]);
  res.push(['同步面板确实已渲染出内容', w.document.body.innerHTML.indexOf('多端云同步')>=0]);
  return res;
});
